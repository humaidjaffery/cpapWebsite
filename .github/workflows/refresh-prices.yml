name: Refresh daily prices

on:
  schedule:
    # GitHub schedules use UTC. 09:17 UTC is 2:17 AM in Arizona.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-price-refresh
  cancel-in-progress: false

env:
  PRICE_DATABASE: .price-state/prices.sqlite3
  PRICE_STATE_TAG: price-state-v1

jobs:
  refresh:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Verify private price-pipeline access
        env:
          PRICE_REPOSITORY_TOKEN: ${{ secrets.CPAPWORLD_READ_TOKEN }}
        run: |
          if [ -z "$PRICE_REPOSITORY_TOKEN" ]; then
            echo "::error::Add the CPAPWORLD_READ_TOKEN repository secret with read-only access to humaidjaffery/cpapWorld."
            exit 1
          fi

      - name: Checkout price pipeline
        uses: actions/checkout@v4
        with:
          repository: humaidjaffery/cpapWorld
          path: price-pipeline
          token: ${{ secrets.CPAPWORLD_READ_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: price-pipeline/pipelines/prices/requirements.txt

      - name: Install price pipeline
        run: python -m pip install -r price-pipeline/pipelines/prices/requirements.txt

      - name: Restore price history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname "$PRICE_DATABASE")"
          gh release download "$PRICE_STATE_TAG" \
            --pattern prices.sqlite3 \
            --dir "$(dirname "$PRICE_DATABASE")" || true

      - name: Record scrape start
        id: scrape-start
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')" >> "$GITHUB_OUTPUT"

      - name: Scrape retailer prices
        run: |
          python price-pipeline/pipelines/prices/run_all.py \
            --database "$PRICE_DATABASE"

      - name: Publish price files
        run: |
          python price-pipeline/pipelines/prices/publish.py \
            --database "$PRICE_DATABASE" \
            --catalog price-pipeline/pipelines/reviews/data/processed/standard_mask_names.csv \
            --output public/data/prices

      - name: Validate prices
        run: |
          python price-pipeline/pipelines/prices/validate.py \
            --database "$PRICE_DATABASE" \
            --output public/data/prices \
            --since "${{ steps.scrape-start.outputs.timestamp }}"

      - name: Save price history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$PRICE_STATE_TAG"; then
            gh release create "$PRICE_STATE_TAG" \
              --title "Daily price history state" \
              --notes "SQLite state used by the automated daily CPAP mask price refresh."
          fi
          gh release upload "$PRICE_STATE_TAG" "$PRICE_DATABASE" --clobber

      - name: Commit updated prices
        run: |
          git add public/data/prices
          if git diff --cached --quiet; then
            echo "No price changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh retailer prices"
          git push origin master
